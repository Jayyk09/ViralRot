services:
  # FastAPI Application
  app:
    build: .
    container_name: viratrot-api
    ports:
      - "8000:8000"
    environment:
      # Database - defaults to local docker db, override with Neon for production
      - DATABASE_URL=${DATABASE_URL:-postgresql://emory_hacks_user:devpassword@db:5432/emory_hacks_db}
      # API keys (required by their respective generation stages)
      - XAI_API_KEY=${XAI_API_KEY:-}
      - XAI_MODEL=${XAI_MODEL:-grok-4.5}
      - SERPAPI_API_KEY=${SERPAPI_API_KEY:-}
      - IMAGE_CANDIDATE_SIGNING_KEY=${IMAGE_CANDIDATE_SIGNING_KEY:-}
      - MINIMAX_API_KEY=${MINIMAX_API_KEY:-}
      - MINIMAX_GROUP_ID=${MINIMAX_GROUP_ID:-}
      - MINIMAX_PETER_VOICE=${MINIMAX_PETER_VOICE:-English_Persuasive_Man}
      - MINIMAX_STEWIE_VOICE=${MINIMAX_STEWIE_VOICE:-English_Insightful_Speaker}
      # Provider timeouts, deadlines, and retries
      - GROK_DIALOGUE_TIMEOUT_SECONDS=${GROK_DIALOGUE_TIMEOUT_SECONDS:-120}
      - GROK_VISUAL_PLANNING_TIMEOUT_SECONDS=${GROK_VISUAL_PLANNING_TIMEOUT_SECONDS:-90}
      - SERPAPI_SEARCH_TIMEOUT_SECONDS=${SERPAPI_SEARCH_TIMEOUT_SECONDS:-20}
      - IMAGE_FETCH_TIMEOUT_SECONDS=${IMAGE_FETCH_TIMEOUT_SECONDS:-15}
      - DIALOGUE_GENERATION_DEADLINE_SECONDS=${DIALOGUE_GENERATION_DEADLINE_SECONDS:-300}
      - VISUAL_PLANNING_DEADLINE_SECONDS=${VISUAL_PLANNING_DEADLINE_SECONDS:-180}
      - AUTOMATIC_VISUAL_GENERATION_DEADLINE_SECONDS=${AUTOMATIC_VISUAL_GENERATION_DEADLINE_SECONDS:-600}
      - REVIEW_VISUAL_GENERATION_DEADLINE_SECONDS=${REVIEW_VISUAL_GENERATION_DEADLINE_SECONDS:-600}
      - FAILED_SLOT_RETRY_DEADLINE_SECONDS=${FAILED_SLOT_RETRY_DEADLINE_SECONDS:-300}
      - PROVIDER_MAX_ATTEMPTS=${PROVIDER_MAX_ATTEMPTS:-3}
      - PROVIDER_RETRY_BASE_DELAY_SECONDS=${PROVIDER_RETRY_BASE_DELAY_SECONDS:-0.5}
      - PROVIDER_RETRY_MAX_DELAY_SECONDS=${PROVIDER_RETRY_MAX_DELAY_SECONDS:-30}
      # Cloudflare R2 (separate background and project-media buckets)
      - STORAGE_BACKEND=${STORAGE_BACKEND:-r2}
      - R2_ACCOUNT_ID=${R2_ACCOUNT_ID:-}
      - R2_ACCESS_KEY_ID=${R2_ACCESS_KEY_ID:-}
      - R2_SECRET_ACCESS_KEY=${R2_SECRET_ACCESS_KEY:-}
      - R2_BACKGROUND_BUCKET_NAME=${R2_BACKGROUND_BUCKET_NAME:-}
      - R2_PROJECT_MEDIA_BUCKET_NAME=${R2_PROJECT_MEDIA_BUCKET_NAME:-}
      - R2_BACKGROUND_PREFIX=${R2_BACKGROUND_PREFIX:-}
    volumes:
      # Static assets (read-only)
      - ./assets/videos:/app/assets/videos:ro
      - ./assets/characters:/app/assets/characters:ro
      # Generated content (read-write)
      - video_output:/app/assets/output
      - audio_output:/app/assets/audio/generated
      - tmp_uploads:/app/tmp/uploads
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    profiles:
      - dev
      - prod

  # Production app (connects to external Neon DB)
  app-prod:
    build: .
    container_name: viratrot-api-prod
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - XAI_API_KEY=${XAI_API_KEY:-}
      - XAI_MODEL=${XAI_MODEL:-grok-4.5}
      - SERPAPI_API_KEY=${SERPAPI_API_KEY:-}
      - IMAGE_CANDIDATE_SIGNING_KEY=${IMAGE_CANDIDATE_SIGNING_KEY:-}
      - MINIMAX_API_KEY=${MINIMAX_API_KEY:-}
      - MINIMAX_GROUP_ID=${MINIMAX_GROUP_ID:-}
      - MINIMAX_PETER_VOICE=${MINIMAX_PETER_VOICE:-English_Persuasive_Man}
      - MINIMAX_STEWIE_VOICE=${MINIMAX_STEWIE_VOICE:-English_Insightful_Speaker}
      # Provider timeouts, deadlines, and retries
      - GROK_DIALOGUE_TIMEOUT_SECONDS=${GROK_DIALOGUE_TIMEOUT_SECONDS:-120}
      - GROK_VISUAL_PLANNING_TIMEOUT_SECONDS=${GROK_VISUAL_PLANNING_TIMEOUT_SECONDS:-90}
      - SERPAPI_SEARCH_TIMEOUT_SECONDS=${SERPAPI_SEARCH_TIMEOUT_SECONDS:-20}
      - IMAGE_FETCH_TIMEOUT_SECONDS=${IMAGE_FETCH_TIMEOUT_SECONDS:-15}
      - DIALOGUE_GENERATION_DEADLINE_SECONDS=${DIALOGUE_GENERATION_DEADLINE_SECONDS:-300}
      - VISUAL_PLANNING_DEADLINE_SECONDS=${VISUAL_PLANNING_DEADLINE_SECONDS:-180}
      - AUTOMATIC_VISUAL_GENERATION_DEADLINE_SECONDS=${AUTOMATIC_VISUAL_GENERATION_DEADLINE_SECONDS:-600}
      - REVIEW_VISUAL_GENERATION_DEADLINE_SECONDS=${REVIEW_VISUAL_GENERATION_DEADLINE_SECONDS:-600}
      - FAILED_SLOT_RETRY_DEADLINE_SECONDS=${FAILED_SLOT_RETRY_DEADLINE_SECONDS:-300}
      - PROVIDER_MAX_ATTEMPTS=${PROVIDER_MAX_ATTEMPTS:-3}
      - PROVIDER_RETRY_BASE_DELAY_SECONDS=${PROVIDER_RETRY_BASE_DELAY_SECONDS:-0.5}
      - PROVIDER_RETRY_MAX_DELAY_SECONDS=${PROVIDER_RETRY_MAX_DELAY_SECONDS:-30}
      - STORAGE_BACKEND=${STORAGE_BACKEND:-r2}
      - R2_ACCOUNT_ID=${R2_ACCOUNT_ID:-}
      - R2_ACCESS_KEY_ID=${R2_ACCESS_KEY_ID:-}
      - R2_SECRET_ACCESS_KEY=${R2_SECRET_ACCESS_KEY:-}
      - R2_BACKGROUND_BUCKET_NAME=${R2_BACKGROUND_BUCKET_NAME:-}
      - R2_PROJECT_MEDIA_BUCKET_NAME=${R2_PROJECT_MEDIA_BUCKET_NAME:-}
      - R2_BACKGROUND_PREFIX=${R2_BACKGROUND_PREFIX:-}
    volumes:
      - ./assets/videos:/app/assets/videos:ro
      - ./assets/characters:/app/assets/characters:ro
      - video_output:/app/assets/output
      - audio_output:/app/assets/audio/generated
      - tmp_uploads:/app/tmp/uploads
    restart: unless-stopped
    profiles:
      - prod-only

  # Local PostgreSQL (development only)
  db:
    image: postgres:16
    container_name: viratrot-postgres
    environment:
      POSTGRES_DB: emory_hacks_db
      POSTGRES_USER: emory_hacks_user
      POSTGRES_PASSWORD: devpassword
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/01-base.sql:ro
      - ./scripts/create_editor_tables.sql:/docker-entrypoint-initdb.d/02-editor.sql:ro
      - ./scripts/create_media_tables.sql:/docker-entrypoint-initdb.d/03-media.sql:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U emory_hacks_user -d emory_hacks_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    profiles:
      - dev

volumes:
  pgdata:
  video_output:
  audio_output:
  tmp_uploads:
